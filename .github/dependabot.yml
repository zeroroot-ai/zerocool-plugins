version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    groups:
      patch-and-minor:
        update-types:
          - minor
          - patch
  # The hash-pinned tool manifests the images and the workflows install with
  # npm ci (zerocool-plugins#13). The Claude Code version in tools/claude is
  # the one the stream-json fixtures came from; a bump re-captures them by
  # hand (packages/claude-member/test/fixtures/README.md), so Dependabot
  # leaves that one package alone.
  - package-ecosystem: npm
    directories:
      - /tools/opencode
      - /tools/claude
      - /tools/hosts
      - /tools/npm
      - /tools/pnpm
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      - dependency-name: "@anthropic-ai/claude-code"
      # Bumped by hand together with packageManager in the root package.json.
      - dependency-name: pnpm
      # npm 12.0.2 ships older tar, undici, ip-address and brace-expansion
      # than 11.19.1 (Trivy and Scorecard on the images, #13). Minor and
      # patch bumps of npm 11 still flow.
      - dependency-name: npm
        update-types:
          - version-update:semver-major
  - package-ecosystem: pip
    directory: /tools/semgrep
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 2
    labels:
      - dependencies
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 2
    labels:
      - dependencies
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: tuesday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - github-actions
