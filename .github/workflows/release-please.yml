name: release-please

# Releases follow the polyrepo convention: release-please opens a release PR
# from Conventional Commits; merging it creates the tag and GitHub release,
# and the publish job below ships @zeroroot-ai/zerocool to npm.
#
# Publishing is DOUBLY gated (zerocool-plugins#26):
#   1. NPM_TOKEN must exist as a secret. Without it the publish job warns
#      and skips — releases still happen, npm just lags. The scope itself is
#      no longer a gate: @zeroroot-ai is the npm account's own username
#      scope, so unlike @zerocool it needs no org and no human step (#26).
#   2. The package must not depend on a git URL. Publishing a tarball whose
#      dependency is git+ssh://…sdk-ts.git would be uninstallable for anyone
#      without repo access; the guard fails the job until the dependency is
#      a semver range on the published @zeroroot-ai/sdk.
#
# The two opt-in stub packages (opencode-gibson-exec, opencode-gibson-
# sessions) are private: true until #12/#13 have implementations — claiming
# npm names with empty packages helps nobody.
#
# GITHUB_TOKEN (not a PAT) is deliberate: tags pushed by GITHUB_TOKEN do not
# fire downstream tag-triggered workflows, but nothing here depends on a tag
# trigger — publish reacts to the action's own outputs in the same run.

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    name: release-please
    runs-on: ubuntu-latest
    outputs:
      releases_created: ${{ steps.rp.outputs.releases_created }}
    steps:
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          app-id: ${{ secrets.SDK_FANOUT_APP_ID }}
          private-key: ${{ secrets.SDK_FANOUT_APP_PRIVATE_KEY }}
          owner: zeroroot-ai
          repositories: zerocool-plugins

      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: rp
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: publish to npm
    needs: release-please
    if: needs.release-please.outputs.releases_created == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      # Presence is not validity. An ABSENT token skips the publish with a
      # warning (a release still happened, npm just lags). An EXPIRED or
      # REVOKED one used to pass this gate and die 40 lines later inside
      # `pnpm publish`, which reads as a broken release rather than as a
      # credential that lapsed. `npm whoami` is the cheapest call that
      # actually exercises the token, so ask it here and name the likely
      # cause in the failure.
      - name: Gate on NPM_TOKEN
        id: gate
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ -z "${NPM_TOKEN:-}" ]; then
            echo "::warning::A release was created but NPM_TOKEN is not configured — npm publish skipped. Add the secret (zerocool-plugins#26)."
            echo "ready=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          code=$(curl -sS -o /tmp/whoami.json -w '%{http_code}' \
            -H "Authorization: Bearer ${NPM_TOKEN}" \
            https://registry.npmjs.org/-/whoami || echo 000)

          if [ "$code" != "200" ]; then
            echo "::error::NPM_TOKEN is present but not usable (HTTP ${code} from /-/whoami)."
            echo "::error::The usual cause is EXPIRY — npm granular tokens are time-limited and the secret does not change when the token lapses. Mint a new one with bypass-2FA enabled and update the NPM_TOKEN secret."
            exit 1
          fi

          echo "npm token authenticates as: $(jq -r .username /tmp/whoami.json)"
          echo "ready=true" >> "$GITHUB_OUTPUT"

      # Advisory, never fatal: a token that authenticates can still be unable
      # to PUBLISH, because this account enforces 2FA and only a token with
      # bypass-2fa may publish unattended. `npm publish --dry-run` does not
      # detect that — it prints a perfect tarball and exits 0 — so the token
      # introspection endpoint is the only place it shows up before the real
      # publish fails with a 403.
      - name: Report token expiry and 2FA bypass
        if: steps.gate.outputs.ready == 'true'
        continue-on-error: true
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          curl -sS -H "Authorization: Bearer ${NPM_TOKEN}" \
            https://registry.npmjs.org/-/npm/v1/tokens \
            | jq -r '.objects[]? | "permissions=\(.permissions | tostring) bypass_2fa=\(.bypass_2fa) expiry=\(.expiry // "none")"' \
            || echo "::warning::could not read token metadata (a granular token may not list tokens) — skipping the advisory check"

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        if: steps.gate.outputs.ready == 'true'

      # The bar this guard defends is "a stranger can install what we publish".
      #
      # It used to warn on git+https and hard-fail only on git+ssh, because
      # git+https at least installs for anyone on the public sdk-ts. That was
      # the right call while @zeroroot-ai/sdk was unpublished; it is published
      # now, so ANY git URL is a regression rather than a stepping stone —
      # a git dependency builds from source on install, cannot express a
      # version range, and needs git plus network reach to GitHub, which an
      # air-gapped or locked-down consumer does not have.
      - name: Refuse to publish an uninstallable dependency
        if: steps.gate.outputs.ready == 'true'
        run: |
          # Every package, not just the published one. A private stub with a
          # git dependency becomes a published package with a git dependency
          # the day it flips, and the guard would not have been watching.
          if grep -rn '"@zeroroot-ai/sdk": "git+' packages/*/package.json; then
            echo "::error::A package depends on @zeroroot-ai/sdk via a git URL (listed above). @zeroroot-ai/sdk is published to npm — use a semver range so consumers install a tarball instead of building from source."
            exit 1
          fi
          # The lockfile is the other half: a semver range in package.json with
          # a git tarball resolved in the lock still installs from GitHub.
          if grep -q 'codeload.github.com/zeroroot-ai/sdk-ts' pnpm-lock.yaml; then
            echo "::error::pnpm-lock.yaml still resolves @zeroroot-ai/sdk from a git tarball. Re-run pnpm install so it resolves from the registry."
            exit 1
          fi

      - uses: pnpm/action-setup@0ebf47130e4866e96fce0953f49152a61190b271 # v6.0.9
        if: steps.gate.outputs.ready == 'true'

      - uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version-file: .tool-versions

      - name: Install and build
        if: steps.gate.outputs.ready == 'true'
        run: |
          pnpm install --frozen-lockfile
          pnpm build

      - name: Publish @zeroroot-ai/zerocool
        if: steps.gate.outputs.ready == 'true'
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          printf '//registry.npmjs.org/:_authToken=%s\n' "$NPM_TOKEN" >> "$HOME/.npmrc"
          pnpm publish --filter @zeroroot-ai/zerocool --access public --no-git-checks
