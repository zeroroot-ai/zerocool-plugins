name: agent-image
# Build + cosign-sign the zerocool AGENT container image (kind=agent dispatched,
# ADR-0006) from source, via the org's reusable image-build workflow — the same
# build-from-source + keyless-OIDC cosign convention gibson-images.yml uses.
#
# The image is an OUTBOUND dispatched worker (no listen port): gibson's platform
# catalog (ADR-0015) references it by digest, and gitops deploys it as an
# external agent workload that registers with the daemon (GIBSON_PLATFORM_URL).
#
# Trigger discipline (ADR-0060): push:main (sha-tagged) + the release tag
# (release-please cuts `opencode-gibson-v*`; tag_pattern derives the semver
# image tag from it) + workflow_dispatch for manual rebuild. No pull_request.
on:
  push:
    branches: [main]
    tags: ['opencode-gibson-v*', 'claude-member-v*']
  workflow_dispatch:
concurrency:
  group: agent-image-${{ github.ref }}
  cancel-in-progress: false
permissions:
  contents: read
jobs:
  image:
    permissions:
      # contents:read: the reusable workflow checks out, builds, pushes to
      # GHCR, signs and attests. It writes nothing to the repository.
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@26202a5181acc259188b0a21b0fc2e75a9f1dac3 # v0.4.1
    with:
      component_name: zerocool-agent
      component_path: .
      dockerfile_path: Dockerfile
      # Busts the apt layer so `apt-get upgrade` actually runs. Without it the
      # buildx GHA cache replays an upgrade from the day the layer was built.
      build_args: APT_CACHE_BUST=${{ github.run_id }}
      image_name: ghcr.io/zeroroot-ai/zerocool-agent
      tag_pattern: type=match,pattern=opencode-gibson-v(.*)

  # The Claude agent image (gibson#1706): the unmodified Claude Code CLI, the
  # Gibson MCP server and the member driver. One image for both shapes,
  # one build per claude-member release.
  image-claude:
    permissions:
      # contents:read: the reusable workflow checks out, builds, pushes to
      # GHCR, signs and attests. It writes nothing to the repository.
      contents: read
      packages: write
      id-token: write
      attestations: write
      security-events: write
      actions: read
    uses: zeroroot-ai/.github/.github/workflows/reusable-image-build.yml@26202a5181acc259188b0a21b0fc2e75a9f1dac3 # v0.4.1
    with:
      component_name: zerocool-claude-agent
      component_path: .
      dockerfile_path: Dockerfile.claude
      # Busts the apt layer so `apt-get upgrade` actually runs. Without it the
      # buildx GHA cache replays an upgrade from the day the layer was built.
      build_args: APT_CACHE_BUST=${{ github.run_id }}
      image_name: ghcr.io/zeroroot-ai/zerocool-claude-agent
      tag_pattern: type=match,pattern=claude-member-v(.*)

  # The release policy, on the digest this run just pushed. It refuses an
  # image the shared build did not sign for this repo and this commit, one
  # whose provenance names another source, or one whose SBOM attestation
  # does not verify. zerocool-plugins#9 criterion 3.
  verify:
    needs: image
    permissions:
      contents: read
      packages: read
    uses: zeroroot-ai/.github/.github/workflows/reusable-verify-release.yml@26202a5181acc259188b0a21b0fc2e75a9f1dac3 # v0.4.1
    with:
      image_ref: ghcr.io/zeroroot-ai/zerocool-agent@${{ needs.image.outputs.digest }}
      expected_subject_repo: ${{ github.repository }}
      expected_commit_sha: ${{ github.sha }}

  verify-claude:
    needs: image-claude
    permissions:
      contents: read
      packages: read
    uses: zeroroot-ai/.github/.github/workflows/reusable-verify-release.yml@26202a5181acc259188b0a21b0fc2e75a9f1dac3 # v0.4.1
    with:
      image_ref: ghcr.io/zeroroot-ai/zerocool-claude-agent@${{ needs.image-claude.outputs.digest }}
      expected_subject_repo: ${{ github.repository }}
      expected_commit_sha: ${{ github.sha }}
